# Netlify configuration for Karaar Saathi frontend

[build]
  # Publish directory containing static assets
  publish = "static"

# Redirect /static/* requests to the root where Netlify serves them
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Redirect API calls to your deployed FastAPI backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://karar-saarthi.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for single page navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
